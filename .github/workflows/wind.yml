# Every six hours, packs the latest GFS 10 m wind for the globe and moves the
# wind-latest tag to a commit holding only that data, so main's history stays clean.
name: Wind

on:
  schedule:
    # GFS runs start at 00, 06, 12 and 18 UTC and reach NOMADS about 3.5 h later.
    - cron: '10 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: wind

jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pack the wind
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q eccodes==2.49.0 numpy==2.5.3
          "$RUNNER_TEMP/venv/bin/python" scripts/wind.py "$RUNNER_TEMP/wind"
      - name: Move the wind-latest tag
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/wind.index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git --work-tree="$RUNNER_TEMP/wind" add -A
          commit=$(git commit-tree "$(git write-tree)" -m "GFS 10 m wind")
          git push -f origin "$commit:refs/tags/wind-latest"
